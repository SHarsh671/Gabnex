spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
server:
  error:
    include-message: never
    include-stacktrace: never
app:
  jwt-secret: ${JWT_SECRET}
  frontend-origin: ${FRONTEND_ORIGIN}
